<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระดับน้ำท่วม กทม.-ปทุมธานี</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f4; --surface:#fcfcfb; --card:#ffffff; --line:#e3e4e2; --line-2:#cfd1ce;
  --ink:#1c1d1b; --ink-2:#4d4f4b; --ink-3:#7a7c77; --accent:#2563c9; --series:#2a6fdb;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --off:#8b8d88;
  --good-bg:#e8f6e8; --warn-bg:#fff5df; --crit-bg:#fbeaea; --off-bg:#eeefed;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --surface:#1a1a19; --card:#1f1f1e; --line:#30312f; --line-2:#3d3e3b;
    --ink:#ececea; --ink-2:#b9bab6; --ink-3:#8c8e89; --accent:#6ea0ff; --series:#6ea0ff;
    --good-bg:#14301a; --warn-bg:#3a2e10; --crit-bg:#3d1b1b; --off-bg:#2a2a29;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:600}
.sub{color:var(--ink-3);font-size:12.5px}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;background:var(--card);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip b{font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.controls input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px}
.controls label{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100% - var(--hh,150px))}
#map{min-height:320px;background:var(--surface)}
aside{border-left:1px solid var(--line);background:var(--card);overflow:auto;display:flex;flex-direction:column}
#list{list-style:none;margin:0;padding:0}
#list li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
#list li:hover,#list li.sel{background:var(--bg)}
.nm{font-weight:500;line-height:1.3}
.meta{color:var(--ink-3);font-size:12px}
.depth{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.depth small{font-weight:400;color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:500;color:var(--ink)}
.b-flooding{background:var(--crit-bg)} .b-minor_flood{background:var(--warn-bg)} .b-normal{background:var(--good-bg)} .b-malfunction{background:var(--off-bg)}
#detail{display:none;padding:16px;border-bottom:1px solid var(--line)}
#detail.on{display:block}
.dhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dhead h2{font-size:16px;margin:0 0 2px;font-weight:600;line-height:1.35}
.hero{display:flex;align-items:baseline;gap:10px;margin:12px 0 4px}
.hero .v{font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.hero .u{color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0;font-size:13px}
.grid2 div span{display:block;color:var(--ink-3);font-size:12px}
.advice{border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.sec{font-weight:600;margin:14px 0 6px;font-size:13.5px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:150px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap;display:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cams{display:grid;gap:10px}
.cam{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000}
.cam video,.cam img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000}
.cam .cap{background:var(--card);padding:6px 10px;font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.cam .msg{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;color:#ddd;font-size:12.5px;padding:12px}
.note{color:var(--ink-3);font-size:12px}
a{color:var(--accent)}
.empty{padding:24px 16px;color:var(--ink-3)}
.err{margin:12px 16px;padding:10px 12px;border-radius:8px;background:var(--crit-bg);font-size:13px}
.camicon{background:#1c1d1b;color:#fff;border:2px solid #fff;border-radius:6px;width:22px!important;height:22px!important;display:flex;align-items:center;justify-content:center;font-size:12px}
.leaflet-container{font:inherit}
.tabs{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.lhead{padding:10px 16px 6px;font-weight:600;font-size:13px;color:var(--ink-2);background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.lhead small{font-weight:400;color:var(--ink-3)}
.b-event{background:#fdeee6} .b-tw{background:var(--off-bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-event{background:#3d2618}}
.evicon{width:20px!important;height:20px!important;border-radius:4px;background:#ec835a;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);color:#1c1d1b;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.twicon{width:18px!important;height:18px!important;border-radius:50%;border:3px solid #2a6fdb;box-shadow:0 0 0 1px #fff;display:flex;align-items:center;justify-content:center;font-size:9px}
.links a{display:block;margin:4px 0}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:45vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <div>
      <h1>ระดับน้ำท่วมถนน กทม. และลำลูกกา–ธัญบุรี (เรียลไทม์)</h1>
      <div class="sub" id="upd">กำลังโหลดข้อมูล…</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="near">📍 ใกล้ฉัน</button>
      <button class="btn primary" id="reload">รีเฟรช</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist">
    <button role="tab" data-a="bkk">กรุงเทพฯ</button>
    <button role="tab" data-a="pt">ลำลูกกา–ธัญบุรี (ปทุมธานี)</button>
    <button role="tab" data-a="all">ทั้งหมด</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="controls">
    <input id="q" type="search" placeholder="ค้นหาถนน / เขต / คลอง เช่น รามคำแหง, ลำลูกกา, คลองหกวา, อุโมงค์">
    <label><input type="checkbox" id="onlyMain"> ถนนสายหลักเท่านั้น</label>
    <label><input type="checkbox" id="showCams" checked> แสดงกล้อง CCTV บนแผนที่</label>
  </div>
</header>
<main>
  <div id="map"></div>
  <aside>
    <section id="detail" aria-live="polite"></section>
    <div id="errbox"></div>
    <ul id="list"></ul>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
/* ---------- แหล่งข้อมูล ----------
 * ระดับน้ำ/กล้องจุดวัด: ระบบตรวจวัดน้ำท่วมถนน สำนักการระบายน้ำ กทม. (floodbangkok.bangkok.go.th) — API เปิด CORS
 * กล้องจราจรเพิ่มเติม: iTIC / Longdo Traffic (camera.longdo.com) — API เปิด CORS
 */
const API = 'https://floodbangkok.bangkok.go.th/bkk/dds/services/api/floods/v1/items/';
const ITIC = 'https://camera.longdo.com/feed/?command=json';
const OFFICIAL = code => 'https://floodbangkok.bangkok.go.th/device-info?sensor_profile_id=' + encodeURIComponent(code);
const TW = 'https://api-v3.thaiwater.net/api/v1/thaiwater30/public/';   // คลังข้อมูลน้ำแห่งชาติ (สสน.)
const EVENTS = 'https://event.longdo.com/feed/json';                        // รายงานเหตุการณ์ iTIC/Longdo (รวมกรมทางหลวง)
const PT_BOX = {s:13.86, n:14.12, w:100.58, e:100.95};                      // ลำลูกกา + ธัญบุรี + ขอบ กทม. ที่ติดกัน
const REGION_BOX = {s:13.45, n:14.30, w:100.25, e:101.05};
const inBox = (o,b) => o.lat>=b.s && o.lat<=b.n && o.lng>=b.w && o.lng<=b.e;
const TW_REFRESH_MS = 10 * 60 * 1000;   // ThaiWater จำกัดจำนวนครั้งเรียก จึงดึงห่างกว่า
const REFRESH_MS = 5 * 60 * 1000;
const STALE_MS = 30 * 60 * 1000;

const STATUS = {
  flooding:    {label:'น้ำท่วม',          icon:'⛔', color:'var(--crit)', hex:'#d03b3b', rank:0},
  minor_flood: {label:'น้ำท่วมเล็กน้อย',  icon:'⚠️', color:'var(--warn)', hex:'#fab219', rank:1},
  normal:      {label:'ปกติ',             icon:'✅', color:'var(--good)', hex:'#0ca30c', rank:2},
  malfunction: {label:'ขัดข้อง/ไม่มีข้อมูล', icon:'⏸', color:'var(--off)',  hex:'#8b8d88', rank:3},
};

const TW_SIT = {
  5:{label:'ล้นตลิ่ง', icon:'⛔', hex:'#d03b3b', cls:'flooding'},
  4:{label:'น้ำมาก',   icon:'⚠️', hex:'#fab219', cls:'minor_flood'},
  3:{label:'ปกติ',     icon:'✅', hex:'#0ca30c', cls:'normal'},
  2:{label:'น้ำน้อย',  icon:'▽',  hex:'#8b8d88', cls:'malfunction'},
  1:{label:'น้ำน้อยวิกฤต', icon:'▽', hex:'#8b8d88', cls:'malfunction'},
};
let savedArea = 'bkk'; try { savedArea = localStorage.getItem('area') || 'bkk'; } catch(e){}
const state = {sensors:[], camsBySensor:{}, itic:[], tw:[], events:[], twErr:null, filter:null, q:'', onlyMain:false, sel:null, me:null, area:savedArea};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = ms => new Date(ms).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ago = ms => { const m = Math.round((Date.now()-ms)/60000); return m < 1 ? 'เมื่อสักครู่' : m < 60 ? m+' นาทีที่แล้ว' : Math.round(m/60)+' ชม.ที่แล้ว'; };

async function getJSON(url, timeout = 20000){
  const ac = new AbortController(); const t = setTimeout(()=>ac.abort(), timeout);
  try { const r = await fetch(url, {signal:ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

/* ---------- แผนที่ ---------- */
document.documentElement.style.setProperty('--hh', $('hdr').offsetHeight + 'px');
addEventListener('resize', ()=>document.documentElement.style.setProperty('--hh', $('hdr').offsetHeight + 'px'));
const map = L.map('map', {zoomControl:true}).setView([13.75, 100.56], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap | ข้อมูล: สำนักการระบายน้ำ กทม., iTIC/Longdo'}).addTo(map);
const sensorLayer = L.layerGroup().addTo(map);
const camLayer = L.layerGroup().addTo(map);
const twLayer = L.layerGroup().addTo(map);
const evLayer = L.layerGroup().addTo(map);
const markers = {};

function sensorIcon(s){
  const st = STATUS[s.status]; const big = s.status==='flooding' || s.status==='minor_flood';
  const r = big ? 9 : 6;
  return L.divIcon({className:'', iconSize:[r*2+4,r*2+4], html:
    `<div style="width:${r*2}px;height:${r*2}px;border-radius:50%;background:${st.hex};border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)${s.isTunnel?';border-radius:3px':''}"></div>`});
}

/* ---------- โหลดข้อมูล ---------- */
async function loadAll(){
  $('upd').textContent = 'กำลังโหลดข้อมูล…'; $('errbox').innerHTML = '';
  try{
    const since = new Date(Date.now() - 45*60000).toISOString();
    const [prof, latest, cams] = await Promise.all([
      getJSON(API + 'sensor_profile?limit=-1&fields=code,name,road,district,lat,long,device_status,main_road'),
      getJSON(API + 'sensor_flood?limit=-1&sort=-date_created&fields=sensor_name,value,timestamp,start_flood,end_flood,heighest_value&filter[date_created][_gte]=' + encodeURIComponent(since)),
      state.camsLoaded ? Promise.resolve(null) : getJSON(API + 'camera_profile?limit=-1&fields=CameraName,LiveStream,SensorName,camera_description,Lat,Long').catch(()=>null),
    ]);
    const last = {};
    for (const r of latest.data) if (!last[r.sensor_name]) last[r.sensor_name] = r;
    if (cams){ state.camsLoaded = true; state.camsBySensor = {};
      for (const c of cams.data) (state.camsBySensor[c.SensorName] ||= []).push(c); }
    state.sensors = prof.data.filter(p => p.lat && p.long).map(p => {
      const l = last[p.code]; const ts = l ? +l.timestamp : null;
      let status = STATUS[p.device_status] ? p.device_status : 'malfunction';
      if (!ts || Date.now() - ts > STALE_MS) status = 'malfunction';
      return { code:p.code, name:p.name, road:p.road, district:p.district, lat:+p.lat, lng:+p.long,
        main:!!p.main_road, isTunnel:p.code.startsWith('TN'), status,
        value: l ? parseFloat(l.value) : null, ts, start:l?.start_flood, end:l?.end_flood,
        peak: l?.heighest_value != null ? parseFloat(l.heighest_value) : null };
    });
    $('upd').textContent = `อัปเดต ${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} น. · ${state.sensors.length} จุดวัด · รีเฟรชอัตโนมัติทุก 5 นาที`;
    drawSensors(); render();
    // ไม่เปิดรายละเอียดใหม่ทั้งหน้า (กันภาพกล้องที่กำลังเล่นสะดุด) อัปเดตแค่ตัวเลขหลัก
    const cur = state.sel && state.sensors.find(x => 'bma:'+x.code === state.sel);
    const hv = document.querySelector('#detail .hero .v');
    if (cur && hv) hv.textContent = cur.status!=='malfunction' && cur.value!=null ? cur.value : '–';
  }catch(e){
    $('upd').textContent = 'โหลดข้อมูลไม่สำเร็จ';
    $('errbox').innerHTML = `<div class="err">ดึงข้อมูลจากระบบของ กทม. ไม่ได้ (${esc(e.message||e)}) ลองกดรีเฟรชอีกครั้ง หรือดูที่ <a href="https://floodbangkok.bangkok.go.th" target="_blank" rel="noopener">floodbangkok.bangkok.go.th</a></div>`;
  }
}

/* ---------- ปทุมธานี: ระดับน้ำคลอง/ประตูระบายน้ำ (ThaiWater) ---------- */
const twDate = s => s ? new Date(s.replace(' ','T')+':00+07:00').getTime() : null;
async function loadTw(){
  let wl, wg;
  try{
    [wl, wg] = await Promise.all([
      getJSON(TW + 'waterlevel_load?province_code=13'),
      getJSON(TW + 'watergate_load?province_code=13'),
    ]);
    try { localStorage.setItem('twCache', JSON.stringify({t:Date.now(), wl, wg})); } catch(e){}
    state.twErr = null;
  }catch(e){
    let c = null; try { c = JSON.parse(localStorage.getItem('twCache')); } catch(_){}
    if (!c) { state.twErr = 'โหลดข้อมูลคลองจาก ThaiWater ไม่สำเร็จ (' + (e.message||e) + ')'; render(); return; }
    wl = c.wl; wg = c.wg; state.twErr = 'ThaiWater ไม่ตอบสนอง แสดงข้อมูลที่จำไว้เมื่อ ' + new Date(c.t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) + ' น.';
  }
  const out = [];
  for (const x of (wl.waterlevel_data?.data || [])) {
    if (x.geocode?.province_code !== '13') continue;
    const st = x.station || {};
    out.push({ kind:'wl', id:st.id, name:st.tele_station_name?.th, river:x.river_name, amphoe:x.geocode.amphoe_name?.th, tambon:x.geocode.tumbon_name?.th,
      lat:+st.tele_station_lat, lng:+st.tele_station_long, ts:twDate(x.waterlevel_datetime),
      wl:parseFloat(x.waterlevel_msl), prev:parseFloat(x.waterlevel_msl_previous), bank:st.min_bank, ground:st.ground_level,
      diff:parseFloat(x.diff_wl_bank), pct:parseFloat(x.storage_percent), sit:x.situation_level, agency:x.agency?.agency_shortname?.th });
  }
  for (const x of (wg.watergate_data?.data || [])) {
    if (x.geocode?.province_code !== '13') continue;
    const st = x.station || {}; const ts = twDate(x.watergate_datetime_in);
    if (!ts || Date.now() - ts > 6*3600e3 || x.watergate_in == null) continue;   // ตัดสถานีที่ไม่ส่งข้อมูลแล้ว
    out.push({ kind:'wg', id:st.id, name:st.tele_station_name?.th, amphoe:x.geocode.amphoe_name?.th, tambon:x.geocode.tumbon_name?.th,
      lat:+st.tele_station_lat, lng:+st.tele_station_long, ts, wIn:+x.watergate_in, wOut:x.watergate_out!=null?+x.watergate_out:null, agency:x.agency?.agency_shortname?.th });
  }
  state.tw = out.filter(t => t.lat && t.lng && (t.kind==='wg' || isFinite(t.wl)));
  drawTw(); render();
}

/* ---------- รายงานน้ำท่วมบนถนน (iTIC/Longdo + กรมทางหลวง) ---------- */
async function loadEvents(){
  try{
    const j = await getJSON(EVENTS);
    const now = Date.now();
    const d = s => s ? new Date(s.replace(' ','T')+'+07:00').getTime() : null;
    state.events = j.filter(e => e.type === '6' || e.icon === 'flood')
      .map(e => ({ eid:e.eid, title:e.title, desc:e.description, lat:+e.latitude, lng:+e.longitude, start:d(e.start), stop:d(e.stop), by:e.contributor }))
      .filter(e => inBox(e, REGION_BOX) && (!e.stop || e.stop >= now));
    drawEvents(); render();
  }catch(e){ /* ไม่บังคับ */ }
}

async function loadItic(){
  try{
    const j = await getJSON(ITIC);
    state.itic = j.filter(c => +c.latitude > 13.45 && +c.latitude < 14.15 && +c.longitude > 100.25 && +c.longitude < 100.98)
      .map(c => ({ title:c.title.replace(/^\((กรุงเทพมหานคร|จ\.[^)]+)\)\s*/, ''), area:(c.title.match(/^\(([^)]+)\)/)||[])[1]||'',
        lat:+c.latitude, lng:+c.longitude,
        hls: c.hls_url && !/tempsus/.test(c.hls_url) ? c.hls_url : null,
        img: c.imgurl && !/X\.X\.X/.test(c.imgurl) ? c.imgurl : null }))
      .filter(c => c.hls || c.img);
    drawItic();
  }catch(e){ /* กล้องเสริม ไม่บังคับ */ }
}

const AREA_VIEW = { bkk:[[13.75,100.56],11], pt:[[13.98,100.72],12], all:[[13.85,100.62],10] };
function matchQ(parts){ const q = state.q.trim().toLowerCase(); return !q || parts.join(' ').toLowerCase().includes(q); }
function areaOk(o){ return state.area==='all' || (state.area==='pt' ? inBox(o, PT_BOX) : !inBox(o, {s:13.93, n:14.3, w:100.25, e:101.05})); }
function sortByMe(list, dflt){ if (state.me){ list.forEach(s => s.dist = distKm(state.me, s)); return list.sort((a,b)=>a.dist-b.dist); } return list.sort(dflt); }

function visible(){
  const list = state.sensors.filter(s =>
    (state.area!=='pt' || inBox(s, PT_BOX)) &&
    (!state.filter || s.status === state.filter) &&
    (!state.onlyMain || s.main) &&
    matchQ([s.name,s.road,s.district,s.code, s.isTunnel?'อุโมงค์':'']));
  return sortByMe(list, (a,b) => (STATUS[a.status].rank-STATUS[b.status].rank) || ((b.value||0)-(a.value||0)) || a.name.localeCompare(b.name,'th'));
}

  if (state.area !== 'bkk') html += `<div class="lhead">แหล่งข้อมูลเพิ่มเติมของพื้นที่</div><div class="links" style="padding:8px 16px 16px;font-size:13px">

      <a href="https://traffic.longdo.com/main/" target="_blank" rel="noopener">Longdo Traffic: รายงานเหตุการณ์และกล้องจราจร</a>
      <span class="note">สายด่วน ปภ. 1784 · กรมทางหลวง 1586</span></div>`;

function advice(s){
  if (s.status==='malfunction' || s.value==null) return {bg:'var(--off-bg)', t:'⏸ เซนเซอร์ไม่ส่งข้อมูลล่าสุด ดูภาพกล้องหรือสอบถาม 1555 ก่อนเดินทาง'};
  const v = s.value;
  if (v <= 0) return {bg:'var(--good-bg)', t:'✅ ไม่มีน้ำบนผิวถนน เดินทางได้ตามปกติ'};
  if (v < 10) return {bg:'var(--warn-bg)', t:'⚠️ น้ำขังเล็กน้อย รถทุกประเภทผ่านได้ ขับช้า ระวังน้ำกระเซ็นและหลุมบ่อ'};
  if (v < 20) return {bg:'var(--warn-bg)', t:'⚠️ น้ำลึกปานกลาง รถเก๋งเตี้ยและจักรยานยนต์เสี่ยง ควรเลี่ยงเส้นทางนี้'};
  return {bg:'var(--crit-bg)', t:'⛔ น้ำลึกตั้งแต่ 20 ซม. ขึ้นไป รถเก๋งและจักรยานยนต์ไม่ควรผ่าน ใช้เส้นทางอื่น'};
}

/* ---------- กราฟย้อนหลัง ---------- */
async function loadHistory(s){
  const box = $('chart');
  try{
    const since = new Date(Date.now()-24*3600e3).toISOString();
    const j = await getJSON(API + `sensor_flood?limit=-1&sort=date_created&fields=value,timestamp&filter[sensor_name][_eq]=${encodeURIComponent(s.code)}&filter[date_created][_gte]=${encodeURIComponent(since)}`);
    if (state.sel !== 'bma:'+s.code || !$('chart')) return;
    const pts = j.data.map(r => ({t:+r.timestamp, v:parseFloat(r.value)})).filter(p => isFinite(p.t) && isFinite(p.v));
    if (!pts.length){ box.innerHTML = '<div class="note">ไม่มีข้อมูลใน 24 ชม.</div>'; return; }
    drawChart(box, pts, {refs:[{v:10},{v:20}], unit:'ซม.', note:'หน่วย: ซม. · เส้นประ = 10 และ 20 ซม.'});
  }catch(e){ box.innerHTML = '<div class="note">โหลดกราฟไม่สำเร็จ</div>'; }
}
function drawChart(box, pts, opt = {}){
  const W = 360, H = 150, P = {l:34, r:8, t:10, b:22};
  const hours = opt.hours || 24, t1 = Date.now(), t0 = t1 - hours*3600e3;
  const refs = opt.refs || [];
  const series = opt.series || [{pts, color:'var(--series)', name:''}];
  const all = series.flatMap(s => s.pts.map(p => p.v)).concat(refs.map(r => r.v));
  let vmin, vmax;
  if (opt.zeroBase !== false){ vmin = 0; vmax = Math.max(25, ...all) * 1.1; }
  else { const lo = Math.min(...all), hi = Math.max(...all), pad = Math.max(0.1, (hi-lo)*0.15); vmin = lo-pad; vmax = hi+pad; }
  const x = t => P.l + (t-t0)/(t1-t0)*(W-P.l-P.r), y = v => H-P.b - (v-vmin)/(vmax-vmin)*(H-P.t-P.b);
  const fmtV = v => opt.zeroBase === false ? v.toFixed(2) : String(Math.round(v));
  const grid = (opt.zeroBase === false ? [vmin+(vmax-vmin)*0.1, vmin+(vmax-vmin)*0.5, vmin+(vmax-vmin)*0.9] : [0])
    .filter(g => refs.every(r => Math.abs(r.v-g) > (vmax-vmin)*0.12));
  const step = hours/4, ticks = [0,1,2,3,4].map(i => t0 + i*step*3600e3);
  const pathOf = pp => { let d = '', prev = null; for (const p of pp){ d += (prev && p.t-prev.t < 40*60e3 ? 'L' : 'M') + x(p.t).toFixed(1)+','+y(p.v).toFixed(1); prev = p; } return d; };
  const tfmt = t => new Date(t).toLocaleString('th-TH', hours > 24 ? {day:'numeric',hour:'2-digit',minute:'2-digit'} : {hour:'2-digit',minute:'2-digit'});
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="กราฟระดับน้ำย้อนหลัง">
    ${grid.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>
      <text x="${P.l-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${fmtV(v)}</text>`).join('')}
    ${refs.map(r=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="var(--ink-3)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
      <text x="${P.l-4}" y="${y(r.v)+4}" text-anchor="end" font-size="10" fill="var(--ink-3)">${r.label||fmtV(r.v)}</text>`).join('')}
    ${ticks.map((t,i)=>`<text x="${x(t)}" y="${H-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}" font-size="10" fill="var(--ink-3)">${tfmt(t)}</text>`).join('')}
    ${series.map(s=>`<path d="${pathOf(s.pts)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 3"':''} vector-effect="non-scaling-stroke"/>`).join('')}
    <line id="xh" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden" vector-effect="non-scaling-stroke"/>
  </svg><div class="tip" id="tip"></div><div class="note">${opt.note||''}</div>`;
  const svg = box.querySelector('svg'), tip = box.querySelector('#tip'), xh = box.querySelector('#xh');
  const nearest = (pp, t) => { let b = pp[0]; for (const p of pp) if (Math.abs(p.t-t) < Math.abs(b.t-t)) b = p; return b; };
  svg.addEventListener('pointermove', ev => {
    const rc = svg.getBoundingClientRect(); const px = (ev.clientX - rc.left) / rc.width * W;
    const t = t0 + (px-P.l)/(W-P.l-P.r)*(t1-t0);
    const hits = series.filter(s => s.pts.length).map(s => ({s, p:nearest(s.pts, t)}));
    if (!hits.length) return;
    xh.setAttribute('x1', x(hits[0].p.t)); xh.setAttribute('x2', x(hits[0].p.t)); xh.setAttribute('visibility','visible');
    tip.style.display='block';
    tip.innerHTML = hits.map(h => `${h.s.name?esc(h.s.name)+' ':''}<b>${opt.zeroBase===false?h.p.v.toFixed(2):h.p.v} ${opt.unit||''}</b>`).join('<br>') + ` · ${tfmt(hits[0].p.t)} น.`;
    const left = x(hits[0].p.t)/W*rc.width; tip.style.left = Math.min(Math.max(left-tip.offsetWidth/2,0), rc.width-tip.offsetWidth)+'px'; tip.style.top = '0px';
  });
  svg.addEventListener('pointerleave', () => { tip.style.display='none'; xh.setAttribute('visibility','hidden'); });
}

const ymd = t => new Date(t + 7*3600e3).toISOString().slice(0,10);

        : {bg:'var(--good-bg)', t:'✅ ระดับน้ำในคลองยังต่ำกว่าตลิ่งพอสมควร'};
  } else adv = {bg:'var(--off-bg)', t:'⇅ ระดับน้ำด้านเหนือ/ท้ายประตูระบายน้ำ ใช้ดูแนวโน้มการระบายน้ำของคลองสายหลัก'};
  d.innerHTML = `
    <div class="dhead"><div><h2>${esc(t.name)}</h2>
      <div class="meta">${t.river?esc(t.river)+' · ':''}ต.${esc(t.tambon)} อ.${esc(t.amphoe)} จ.ปทุมธานี · ${esc(t.agency||'')}</div></div>
      <button class="btn" id="close" aria-label="ปิด">✕</button></div>
    ${t.kind==='wl' ? `
      <div class="hero"><span class="v">${t.wl.toFixed(2)}</span><span class="u">ม.รทก. (ระดับน้ำในคลอง)</span></div>
      ${sit?`<span class="badge b-${sit.cls}">${sit.icon} ${sit.label}</span>`:''} <span class="meta">${trend}</span>
      <div class="advice" style="background:${adv.bg}">${adv.t}</div>
      <div class="grid2">
        <div><span>ระดับตลิ่ง</span>${t.bank!=null?(+t.bank).toFixed(2)+' ม.รทก.':'–'}</div>
        <div><span>ห่างจากตลิ่ง</span>${isFinite(t.diff)?t.diff.toFixed(2)+' ม.':'–'}</div>
        <div><span>ความจุลำน้ำ</span>${isFinite(t.pct)?t.pct.toFixed(0)+'%':'–'}</div>
        <div><span>ข้อมูลล่าสุด</span>${t.ts?fmtTime(t.ts)+' ('+ago(t.ts)+')':'–'}</div>
      </div>` : `
      <div class="grid2" style="margin-top:12px">
        <div><span>ระดับน้ำเหนือประตู</span><b style="font-size:22px">${t.wIn.toFixed(2)}</b> ม.รทก.</div>
        <div><span>ระดับน้ำท้ายประตู</span><b style="font-size:22px">${t.wOut!=null?t.wOut.toFixed(2):'–'}</b> ม.รทก.</div>
        <div><span>ข้อมูลล่าสุด</span>${t.ts?fmtTime(t.ts)+' ('+ago(t.ts)+')':'–'}</div>
      </div>
      <div class="advice" style="background:${adv.bg}">${adv.t}</div>`}
    <div class="sec">ระดับน้ำย้อนหลัง 3 วัน</div>
    <div class="chart" id="chart"><div class="note">กำลังโหลด…</div></div>
    ${nearBma.length?`<div class="sec">จุดวัดน้ำบนถนนใกล้เคียง</div>`+nearBma.map(o=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;cursor:pointer" data-go="${esc(o.s.code)}"><span>${esc(o.s.name)} <span class="meta">${o.d.toFixed(1)} กม.</span></span><span class="badge b-${o.s.status}">${STATUS[o.s.status].icon} ${o.s.status!=='malfunction'&&o.s.value!=null?o.s.value+' ซม.':STATUS[o.s.status].label}</span></div>`).join(''):''}
    <p class="note" style="margin-top:12px">ที่มา: คลังข้อมูลน้ำแห่งชาติ (สสน.) · <a href="https://www.thaiwater.net/water/wl" target="_blank" rel="noopener">thaiwater.net</a> · ม.รทก. = เมตรจากระดับน้ำทะเลปานกลาง</p>`;
  $('close').onclick = () => { d.classList.remove('on'); d.innerHTML=''; state.sel=null; render(); };
  d.querySelectorAll('[data-go]').forEach(n => n.onclick = () => showDetail(n.dataset.go));
  d.parentElement.scrollTop = 0;
  loadTwHistory(t, key);
}
const graphPts = arr => {
  const pts = (arr||[]).map(r => ({t:twDate(r.datetime), v:r.value})).filter(p => p.t && p.v != null && isFinite(p.v));
  if (pts.length < 5) return pts;
  const vs = pts.map(p => p.v).sort((a,b)=>a-b), med = vs[Math.floor(vs.length/2)];
  return pts.filter(p => Math.abs(p.v - med) <= 3);   // ตัดค่าผิดปกติจากเซนเซอร์ (เช่น -12 ม.)
};
async function loadTwHistory(t, key){
  const box = $('chart'); const now = Date.now();
  try{
    if (t.kind === 'wl'){
      const j = await getJSON(TW + `waterlevel_graph?station_type=tele_waterlevel&station_id=${t.id}&start_date=${ymd(now-3*864e5)}&end_date=${encodeURIComponent(ymd(now)+' 23:59')}`);
      if (state.sel !== key) return;
      const pts = graphPts(j.data?.graph_data);
      if (!pts.length) throw 0;
      const refs = t.bank!=null ? [{v:+t.bank, label:'ตลิ่ง'}] : [];
      drawChart(box, pts, {hours:72, zeroBase:false, unit:'ม.', refs, note:'หน่วย: ม.รทก. · เส้นประ = ระดับตลิ่ง'});
    } else {
      const j = await getJSON(TW + `watergate_graph?station_id=${t.id}&start_date=${ymd(now-3*864e5)}&end_date=${ymd(now)}`);
      if (state.sel !== key) return;
      const g = (j.data||[]).map(x => graphPts(x?.data?.graph_data || x?.graph_data || x?.data));
      if (!g[0]?.length) throw 0;
      drawChart(box, null, {hours:72, zeroBase:false, unit:'ม.', series:[{pts:g[0], color:'var(--series)', name:'เหนือ'}, ...(g[1]?.length?[{pts:g[1], color:'var(--ink-3)', name:'ท้าย', dash:true}]:[])],
        note:'เส้นทึบ = เหนือประตู · เส้นประ = ท้ายประตู (ม.รทก.)'});
    }
  }catch(e){ if ($('chart') && state.sel===key) box.innerHTML = '<div class="note">ไม่มีข้อมูลย้อนหลัง หรือ ThaiWater ไม่ตอบสนองในขณะนี้</div>'; }
}

/* ---------- รายละเอียด: รายงานน้ำท่วม ---------- */
function showEvent(eid){
  const e = state.events.find(o => o.eid === eid); if (!e) return;
  state.sel = 'ev:'+eid; render(); map.setView([e.lat,e.lng], Math.max(map.getZoom(), 15));
  const d = $('detail'); d.classList.add('on');
  const nearBma = state.sensors.map(s=>({s,d:distKm(s,e)})).filter(o=>o.d<=3).sort((a,b)=>a.d-b.d).slice(0,3);
  const nearTw = state.tw.map(t=>({t,d:distKm(t,e)})).filter(o=>o.d<=8).sort((a,b)=>a.d-b.d).slice(0,3);
  const nearCam = state.itic.map(c=>({...c,d:distKm(c,e)})).filter(c=>c.d<=3).sort((a,b)=>a.d-b.d).slice(0,2);
  const depth = (e.desc||'').match(/(\d+)\s*[-–]\s*(\d+)\s*ซม|(\d+)\s*ซม/);
  d.innerHTML = `
    <div class="dhead"><div><h2>${esc(e.title)}</h2><div class="meta">รายงานโดย ${esc(e.by||'-')} · ${e.start?fmtTime(e.start):''}</div></div>
      <button class="btn" id="close" aria-label="ปิด">✕</button></div>
    ${depth?`<div class="hero"><span class="v">${depth[3]||depth[1]+'–'+depth[2]}</span><span class="u">ซม. (ตามที่ผู้รายงานระบุ)</span></div>`:''}
    <span class="badge b-event">! รายงานน้ำท่วม</span>
    <p style="white-space:pre-line;margin:10px 0">${esc(e.desc||'')}</p>
    <div class="grid2"><div><span>เริ่มรายงาน</span>${e.start?fmtTime(e.start):'–'}</div><div><span>คาดว่าสิ้นสุด</span>${e.stop?fmtTime(e.stop):'–'}</div></div>
    <div class="note">ข้อมูลจากการรายงานของผู้ใช้/หน่วยงาน ไม่ใช่เซนเซอร์ ระดับน้ำจริงอาจเปลี่ยนไปแล้ว</div>
    ${nearCam.length?`<div class="sec">กล้องใกล้เคียง</div><div class="cams" id="evcams"></div>`:''}
    ${nearBma.length?`<div class="sec">เซนเซอร์บนถนนใกล้เคียง</div>`+nearBma.map(o=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;cursor:pointer" data-go="bma:${esc(o.s.code)}"><span>${esc(o.s.name)} <span class="meta">${o.d.toFixed(1)} กม.</span></span><span class="badge b-${o.s.status}">${STATUS[o.s.status].icon} ${o.s.status!=='malfunction'&&o.s.value!=null?o.s.value+' ซม.':STATUS[o.s.status].label}</span></div>`).join(''):''}
    ${nearTw.length?`<div class="sec">ระดับน้ำคลองใกล้เคียง</div>`+nearTw.map(o=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;cursor:pointer" data-go="${o.t.kind}:${o.t.id}"><span>${esc(o.t.name)} <span class="meta">${o.d.toFixed(1)} กม.</span></span><span class="badge b-${o.t.kind==='wl'&&TW_SIT[o.t.sit]?TW_SIT[o.t.sit].cls:'malfunction'}">${o.t.kind==='wl'?o.t.wl.toFixed(2)+' ม. · '+(TW_SIT[o.t.sit]?.label||''):'ปตร. '+o.t.wIn.toFixed(2)+' ม.'}</span></div>`).join(''):''}
    <p class="note" style="margin-top:12px"><a href="https://www.google.com/maps?q=${e.lat},${e.lng}" target="_blank" rel="noopener">เปิดตำแหน่งใน Google Maps</a> · <a href="https://traffic.longdo.com/main/" target="_blank" rel="noopener">Longdo Traffic</a></p>`;
  $('close').onclick = () => { stopMedia(d); d.classList.remove('on'); d.innerHTML=''; state.sel=null; render(); };
  d.querySelectorAll('[data-go]').forEach(n => n.onclick = () => { stopMedia(d); const g = n.dataset.go; g.startsWith('bma:') ? showDetail(g.slice(4)) : showTw(g); });
  nearCam.forEach(c => $('evcams').appendChild(iticCam(c, c.d)));
  d.parentElement.scrollTop = 0;
}

/* ---------- กล้อง ---------- */
function bmaCam(c){
  const el = document.createElement('div'); el.className = 'cam';
  el.innerHTML = `<div class="msg">กดเพื่อเปิดภาพสด<br>${esc(c.camera_description||c.CameraName)}</div>
    <div class="cap"><span>${esc(c.camera_description||'')}</span><span>${esc(c.CameraName)}</span></div>`;
  el.querySelector('.msg').style.cursor = 'pointer';
  el.querySelector('.msg').onclick = () => playBma(el, c);
  return el;
}
function playBma(el, c){
  const msg = el.querySelector('.msg'); msg.textContent = 'กำลังเชื่อมต่อกล้อง…';
  const v = document.createElement('video'); v.muted = true; v.autoplay = true; v.playsInline = true; v.controls = true;
  const urls = [c.LiveStream, c.LiveStream.replace(/&mp4=[^&]*/, '')];
  let i = 0, done = false;
  const fail = () => { if (done) return; if (++i < urls.length){ v.src = urls[i]; return; }
    done = true; v.remove(); msg.style.display='flex';
    msg.innerHTML = `กล้องไม่ตอบสนองในขณะนี้<br>(เซิร์ฟเวอร์กล้องของ กทม. อาจขัดข้อง)<br><a href="${OFFICIAL(c.SensorName)}" target="_blank" rel="noopener" style="color:#9cc2ff">เปิดในเว็บ กทม.</a>`; };
  const timer = setTimeout(fail, 15000);
  v.onloadeddata = () => { done = true; clearTimeout(timer); msg.style.display='none'; };
  v.onerror = () => { clearTimeout(timer); fail(); };
  v.src = urls[0]; el.insertBefore(v, el.firstChild);
}
function iticCam(c, d){
  const el = document.createElement('div'); el.className = 'cam';
  el.innerHTML = `<div class="msg">กำลังโหลดภาพ…</div><div class="cap"><span>${esc(c.title)}</span><span>${d!=null?d.toFixed(1)+' กม.':esc(c.area)}</span></div>`;
  const msg = el.querySelector('.msg');
  const showErr = () => { msg.style.display='flex'; msg.textContent = 'กล้องนี้ไม่ส่งภาพในขณะนี้'; };
  if (c.hls){
    const v = document.createElement('video'); v.muted = true; v.autoplay = true; v.playsInline = true; v.controls = true;
    v.onloadeddata = () => msg.style.display='none';
    if (v.canPlayType('application/vnd.apple.mpegurl')){ v.src = c.hls; v.onerror = showErr; }
    else if (window.Hls && Hls.isSupported()){ const h = new Hls({maxBufferLength:10}); h.loadSource(c.hls); h.attachMedia(v); v._hls = h;
      h.on(Hls.Events.ERROR, (_, e) => { if (e.fatal){ h.destroy(); c.img ? jpegInto(el, c.img, msg) : showErr(); } }); }
    else if (c.img) { jpegInto(el, c.img, msg); return el; }
    el.insertBefore(v, el.firstChild);
  } else jpegInto(el, c.img, msg);
  return el;
}
function jpegInto(el, url, msg){
  el.querySelector('video')?.remove();
  const img = new Image(); img.alt = 'ภาพจากกล้อง';
  img.onload = () => msg.style.display='none';
  img.onerror = () => { msg.style.display='flex'; msg.textContent='กล้องนี้ไม่ส่งภาพในขณะนี้'; };
  const tick = () => { if (!img.isConnected && img._started) return clearInterval(img._iv); img._started = true; img.src = url + (url.includes('?')?'&':'?') + '_=' + Date.now(); };
  tick(); img._iv = setInterval(tick, 10000);
  el.insertBefore(img, el.firstChild);
}
function openItic(c){
  stopMedia($('detail'));
  const d = $('detail'); d.classList.add('on'); state.sel = null; render();
  d.innerHTML = `<div class="dhead"><div><h2>📷 ${esc(c.title)}</h2><div class="meta">${esc(c.area)} · กล้องจราจร iTIC</div></div><button class="btn" id="close">✕</button></div>
    <div class="cams" id="one" style="margin-top:10px"></div>`;
  $('one').appendChild(iticCam(c));
  const near = state.sensors.map(s=>({s,d:distKm(s,c)})).filter(x=>x.d<=2).sort((a,b)=>a.d-b.d).slice(0,5);
  if (near.length){ d.insertAdjacentHTML('beforeend', `<div class="sec">จุดวัดระดับน้ำใกล้กล้องนี้</div>` + near.map(x =>
    `<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;cursor:pointer" data-go="${esc(x.s.code)}"><span>${esc(x.s.name)} <span class="meta">${x.d.toFixed(1)} กม.</span></span><span class="badge b-${x.s.status}">${STATUS[x.s.status].icon} ${x.s.status!=='malfunction'&&x.s.value!=null?x.s.value+' ซม.':STATUS[x.s.status].label}</span></div>`).join(''));
    d.querySelectorAll('[data-go]').forEach(n => n.onclick = () => { stopMedia(d); showDetail(n.dataset.go); }); }
  $('close').onclick = () => { stopMedia(d); d.classList.remove('on'); d.innerHTML=''; };
}
function stopMedia(root){
  root.querySelectorAll('video').forEach(v => { v._hls?.destroy(); v.pause(); v.removeAttribute('src'); v.load(); });
  root.querySelectorAll('img').forEach(i => clearInterval(i._iv));
}

/* ---------- ตำแหน่งผู้ใช้ ---------- */
function distKm(a, b){ const R=6371, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
let meMarker = null;
$('near').onclick = () => {
  if (state.me){ state.me = null; meMarker?.remove(); $('near').textContent='📍 ใกล้ฉัน'; render(); return; }
  if (!navigator.geolocation) return alert('เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง');
  $('near').textContent = 'กำลังหาตำแหน่ง…';
  navigator.geolocation.getCurrentPosition(p => {
    state.me = {lat:p.coords.latitude, lng:p.coords.longitude};
    meMarker = L.circleMarker([state.me.lat,state.me.lng], {radius:8, color:'#fff', weight:3, fillColor:'#2563c9', fillOpacity:1}).addTo(map).bindTooltip('ตำแหน่งของคุณ');
    map.setView([state.me.lat,state.me.lng], 14); $('near').textContent='✕ เลิกเรียงตามระยะ'; render();
  }, () => { $('near').textContent='📍 ใกล้ฉัน'; alert('ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง'); }, {enableHighAccuracy:true, timeout:10000});
};

/* ---------- อีเวนต์ ---------- */
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; state.filter = state.filter===b.dataset.k ? null : b.dataset.k; render(); };
$('list').onclick = e => { const li = e.target.closest('li[data-c]'); if (!li) return; stopMedia($('detail'));
  const [k, id] = [li.dataset.c.slice(0, li.dataset.c.indexOf(':')), li.dataset.c.slice(li.dataset.c.indexOf(':')+1)];
  if (k==='bma') showDetail(id); else if (k==='ev') showEvent(id); else showTw(li.dataset.c); };
$('q').oninput = e => { state.q = e.target.value; render(); };
$('onlyMain').onchange = e => { state.onlyMain = e.target.checked; render(); };
$('showCams').onchange = drawItic;
$('reload').onclick = () => { loadAll(); loadTw(); loadEvents(); };
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; state.area = b.dataset.a;
  try { localStorage.setItem('area', state.area); } catch(_){}
  const [c,z] = AREA_VIEW[state.area]; map.setView(c, z); render(); };

{ const [c,z] = AREA_VIEW[state.area] || AREA_VIEW.bkk; map.setView(c, z); }
loadAll(); loadItic(); loadTw(); loadEvents();
setInterval(() => { loadAll(); loadEvents(); }, REFRESH_MS);
setInterval(loadTw, TW_REFRESH_MS);
</script>
